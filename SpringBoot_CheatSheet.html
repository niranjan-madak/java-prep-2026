<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Boot Cheat Sheet</title>
<style>
/*
  THEME: Charcoal + Spring Green
  Background : #1a1a2e → #16213e (deep navy charcoal)
  Card bg    : #0f3460  subtle dark blue-slate
  Accent     : #4ade80  bright spring green
  Code text  : #e2fce4  near-white with green tint  (high contrast on dark)
  Body text  : #e2e8f0  clean white-grey
  Muted      : #8ba4a0
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #111827;
  color: #e2e8f0;
  min-height: 100vh;
  padding-bottom: 80px;
}
header {
  background: linear-gradient(135deg, #064e3b 0%, #111827 100%);
  padding: 22px 16px 18px;
  text-align: center;
  border-bottom: 2px solid #4ade80;
}
header h1 { font-size: 1.45rem; color: #4ade80; font-weight: 800; letter-spacing: -0.3px; }
header p  { font-size: 0.82rem; color: #9ca3af; margin-top: 5px; }

.sticky-bar {
  position: sticky; top: 0; z-index: 200;
  background: #1f2937;
  border-bottom: 1px solid #374151;
  padding: 10px 12px;
}
.sticky-bar input {
  width: 100%; padding: 9px 14px; border-radius: 8px;
  border: 1px solid #374151;
  background: #111827; color: #e2e8f0;
  font-size: 0.92rem; outline: none;
}
.sticky-bar input:focus { border-color: #4ade80; }
.sticky-bar input::placeholder { color: #6b7280; }

.section-wrap { margin: 14px 10px 4px; }
.section-title {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.6px;
  color: #4ade80; font-weight: 800; padding-bottom: 7px;
  border-bottom: 1px solid #374151; margin-bottom: 8px;
}

.q-card {
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 10px; margin-bottom: 7px; overflow: hidden;
}
.q-card.open { border-color: #4ade80; }

.q-trigger {
  display: flex; align-items: center; gap: 10px; padding: 13px 14px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
}
.q-trigger:active { background: #263345; }

.q-text { flex: 1; font-size: 0.88rem; font-weight: 600; color: #d1fae5; line-height: 1.35; }
.q-card.open .q-text { color: #4ade80; }

.chevron {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
  background: #374151;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #9ca3af;
  transition: transform 0.22s ease, background 0.2s;
}
.q-card.open .chevron { transform: rotate(180deg); background: #4ade80; color: #111827; }

.q-body { display: none; border-top: 1px solid #374151; }
.q-card.open .q-body { display: block; }

.note {
  margin: 10px 14px 0; background: #0d1f16;
  border-left: 3px solid #4ade80;
  border-radius: 0 6px 6px 0; padding: 8px 11px;
  font-size: 0.78rem; color: #86efac; line-height: 1.55;
}

.variant { padding: 10px 14px 12px; border-bottom: 1px solid #111827; }
.variant:last-child { border-bottom: none; }
.vlabel {
  font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1px; color: #34d399; margin-bottom: 7px;
}

pre {
  background: #0d1117;
  border: 1px solid #374151;
  border-radius: 7px; padding: 12px; overflow-x: auto;
  font-family: 'Courier New', monospace;
  font-size: 0.74rem; line-height: 1.7;
  color: #e2fce4;   /* near-white with green tint – excellent contrast */
  white-space: pre;
}

.no-results { text-align: center; padding: 50px 20px; color: #374151; font-size: 0.9rem; }

/* FAB */
#fabBtn {
  position: fixed; bottom: 24px; right: 20px; width: 54px; height: 54px;
  border-radius: 50%; background: #4ade80; color: #111827;
  font-size: 2rem; font-weight: 300; border: none; cursor: pointer;
  box-shadow: 0 4px 20px rgba(74,222,128,0.4); z-index: 999;
  display: flex; align-items: center; justify-content: center;
  line-height: 1; transition: transform 0.15s, box-shadow 0.15s;
}
#fabBtn:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(74,222,128,0.3); }

/* Modal backdrop */
#addModal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.80); z-index: 1000;
  display: flex; align-items: flex-end; justify-content: center;
}
@media (min-width: 600px) { #addModal { align-items: center; padding: 20px; } }

/* Modal box */
#modalBox {
  background: #1f2937; border-radius: 16px 16px 0 0; width: 100%;
  max-width: 620px; max-height: 92vh; display: flex; flex-direction: column;
  overflow: hidden; border: 1px solid #4ade80;
}
@media (min-width: 600px) { #modalBox { border-radius: 16px; } }

#modalHeader {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid #374151; flex-shrink: 0;
}
#modalTitle { font-size: 1rem; font-weight: 700; color: #4ade80; }
#modalClose {
  background: #374151; border: none; color: #9ca3af;
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
}
#modalClose:active { background: #4b5563; }

#modalBody { padding: 16px 18px; overflow-y: auto; flex: 1; }

.modal-label {
  display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: #4ade80; margin-bottom: 6px; margin-top: 14px;
}
.modal-label:first-child { margin-top: 0; }

.modal-input {
  width: 100%; padding: 9px 12px; border-radius: 7px;
  border: 1px solid #374151;
  background: #111827; color: #e2e8f0;
  font-size: 0.88rem; outline: none; margin-bottom: 2px;
}
.modal-input:focus { border-color: #4ade80; }

.modal-code {
  width: 100%; padding: 9px 12px; border-radius: 7px;
  border: 1px solid #374151;
  background: #0d1117; color: #e2fce4;
  font-family: 'Courier New', monospace;
  font-size: 0.78rem; line-height: 1.6; outline: none; resize: vertical; margin-bottom: 2px;
}
.modal-code:focus { border-color: #4ade80; }

.variant-block {
  background: #111827; border: 1px solid #374151;
  border-radius: 8px; padding: 12px; margin-bottom: 10px;
}
.vb-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.vb-label { font-size: 0.75rem; font-weight: 700; color: #6b7280; }
.rm-variant {
  background: #1f2937; border: 1px solid #374151; color: #f87171;
  border-radius: 5px; padding: 3px 8px; font-size: 0.7rem; cursor: pointer;
}

#addVariantBtn {
  width: 100%; padding: 9px; margin-top: 4px; background: transparent;
  border: 1px dashed #374151; color: #6b7280;
  border-radius: 7px; font-size: 0.82rem; cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
#addVariantBtn:hover, #addVariantBtn:active { border-color: #4ade80; color: #4ade80; }

#modalFooter {
  display: flex; gap: 10px; padding: 14px 18px;
  border-top: 1px solid #374151; flex-shrink: 0;
}
#cancelBtn {
  flex: 1; padding: 11px; border-radius: 8px;
  border: 1px solid #374151; background: transparent;
  color: #9ca3af; font-size: 0.9rem; cursor: pointer;
}
#cancelBtn:active { background: #263345; }
#saveBtn {
  flex: 2; padding: 11px; border-radius: 8px; border: none;
  background: #4ade80; color: #111827;
  font-size: 0.9rem; font-weight: 700; cursor: pointer;
}
#saveBtn:active { background: #22c55e; }

.custom-card { border-color: #064e3b !important; }
.custom-card.open { border-color: #4ade80 !important; }
</style>
</head>
<body>
<header>
  <h1>&#127807; Spring Boot Cheat Sheet</h1>
  <p>Tap a question to see the code &bull; Tap <strong>+</strong> to add your own</p>
</header>
<div class="sticky-bar">
  <input type="text" id="searchBox" placeholder="Search (e.g. annotation, REST, JPA, security...)" />
</div>
<div id="root"></div>
<div id="noResults" class="no-results" style="display:none">No matches found.</div>
<button id="fabBtn" onclick="openModal()" title="Add new question">+</button>
<div id="addModal" style="display:none">
  <div id="modalBox">
    <div id="modalHeader">
      <span id="modalTitle">Add New Question</span>
      <button id="modalClose" onclick="closeModal()">&#10005;</button>
    </div>
    <div id="modalBody">
      <label class="modal-label">Question Title *</label>
      <input type="text" class="modal-input" id="qTitle" placeholder="e.g. How to configure datasource?" />
      <label class="modal-label">Note / Tip (optional)</label>
      <input type="text" class="modal-input" id="qNote" placeholder="e.g. Used in Spring Boot 3.x" />
      <label class="modal-label" style="margin-top:16px">Answers / Variants</label>
      <div id="variantsWrap"></div>
      <button id="addVariantBtn" type="button" onclick="addVariant()">+ Add Another Variant</button>
    </div>
    <div id="modalFooter">
      <button id="cancelBtn" onclick="closeModal()">Cancel</button>
      <button id="saveBtn" onclick="saveQuestion()">Save Question</button>
    </div>
  </div>
</div>
<script>
var SECTIONS = [
{
  title: "Core Annotations",
  qs: [
    {
      q: "What is @SpringBootApplication and what does it combine?",
      note: "Single annotation that bootstraps the entire Spring Boot application.",
      variants: [{l:"@SpringBootApplication usage", c:
`@SpringBootApplication  // combines @Configuration + @EnableAutoConfiguration + @ComponentScan
public class MyApplication {
    public static void main(String[] args) {
        SpringApplication.run(MyApplication.class, args);
    }
}`}]
    },
    {
      q: "What is the difference between @Component, @Service, @Repository, @Controller?",
      note: "All are specializations of @Component. Spring treats them the same for bean creation but they carry semantic meaning.",
      variants: [{l:"All four stereotypes", c:
`@Component       // generic Spring-managed bean
public class MyUtil { }

@Service         // business/service layer
public class UserService { }

@Repository      // data access layer – also translates DB exceptions
public class UserRepository { }

@Controller      // web layer – handles HTTP requests (returns views)
public class UserController { }

@RestController  // @Controller + @ResponseBody (returns JSON/XML directly)
public class UserRestController { }`}]
    },
    {
      q: "What is @Autowired and how does dependency injection work?",
      note: "Prefer constructor injection over field injection — it makes dependencies explicit and easier to test.",
      variants: [
        {l:"Field injection (not recommended)", c:
`@Service
public class OrderService {
    @Autowired
    private UserService userService; // field injection
}`},
        {l:"Constructor injection (recommended)", c:
`@Service
public class OrderService {
    private final UserService userService;

    // Spring auto-injects when there is only one constructor
    public OrderService(UserService userService) {
        this.userService = userService;
    }
}`},
        {l:"Setter injection", c:
`@Service
public class OrderService {
    private UserService userService;

    @Autowired
    public void setUserService(UserService userService) {
        this.userService = userService;
    }
}`}
      ]
    },
    {
      q: "What is @Bean and @Configuration?",
      note: "@Configuration marks a class as a source of bean definitions. @Bean marks a method whose return value is registered as a bean.",
      variants: [{l:"@Configuration + @Bean", c:
`@Configuration
public class AppConfig {

    @Bean
    public PasswordEncoder passwordEncoder() {
        return new BCryptPasswordEncoder();
    }

    @Bean
    public ModelMapper modelMapper() {
        return new ModelMapper();
    }
}`}]
    },
    {
      q: "What is @Value and how do you inject properties?",
      variants: [
        {l:"@Value from application.properties", c:
`# application.properties
app.name=MyApp
app.version=1.0.0

@Component
public class AppInfo {
    @Value("\${app.name}")
    private String appName;

    @Value("\${app.version}")
    private String version;

    @Value("\${app.timeout:5000}") // default 5000 if not set
    private int timeout;
}`},
        {l:"@ConfigurationProperties (type-safe, preferred)", c:
`# application.properties
app.name=MyApp
app.version=1.0.0
app.timeout=3000

@ConfigurationProperties(prefix = "app")
@Component
public class AppProperties {
    private String name;
    private String version;
    private int timeout;
    // getters and setters required
}`}
      ]
    },
    {
      q: "What is @Qualifier and when do you use it?",
      note: "Use @Qualifier when multiple beans of the same type exist and Spring can't decide which one to inject.",
      variants: [{l:"@Qualifier example", c:
`@Component("mysqlRepo")
public class MySQLUserRepository implements UserRepository { }

@Component("mongoRepo")
public class MongoUserRepository implements UserRepository { }

@Service
public class UserService {
    private final UserRepository userRepository;

    public UserService(@Qualifier("mysqlRepo") UserRepository userRepository) {
        this.userRepository = userRepository;
    }
}`}]
    },
    {
      q: "What is @Primary?",
      note: "@Primary marks a bean as the default when multiple beans of the same type exist. Can be overridden by @Qualifier.",
      variants: [{l:"@Primary example", c:
`@Primary
@Component
public class MySQLUserRepository implements UserRepository { }

@Component
public class MongoUserRepository implements UserRepository { }

@Service
public class UserService {
    // MySQLUserRepository will be injected by default
    @Autowired
    private UserRepository userRepository;
}`}]
    },
    {
      q: "What is @Scope and what bean scopes are available?",
      variants: [{l:"Bean scope examples", c:
`// singleton (default) – one instance per Spring context
@Component
@Scope("singleton")
public class SingletonBean { }

// prototype – new instance every time it is requested
@Component
@Scope("prototype")
public class PrototypeBean { }

// request – one instance per HTTP request (web only)
@Component
@Scope("request")
public class RequestBean { }

// session – one instance per HTTP session (web only)
@Component
@Scope("session")
public class SessionBean { }`}]
    },
    {
      q: "What are @PostConstruct and @PreDestroy?",
      variants: [{l:"Lifecycle callback annotations", c:
`@Component
public class CacheManager {

    @PostConstruct  // runs after bean is created and injected
    public void init() {
        System.out.println("Cache initialized");
    }

    @PreDestroy     // runs before bean is destroyed
    public void cleanup() {
        System.out.println("Cache cleared");
    }
}`}]
    },
    {
      q: "What is @Lazy and when should you use it?",
      note: "By default all singleton beans are created at startup. @Lazy delays creation until first use.",
      variants: [{l:"@Lazy example", c:
`@Component
@Lazy
public class HeavyService {
    public HeavyService() {
        System.out.println("HeavyService created"); // only when first accessed
    }
}

@Service
public class MyService {
    @Autowired
    @Lazy
    private HeavyService heavyService; // injected lazily
}`}]
    }
  ]
},
{
  title: "REST API – Controllers & Mappings",
  qs: [
    {
      q: "How do you create a REST controller with all HTTP methods?",
      variants: [{l:"Full REST controller", c:
`@RestController
@RequestMapping("/api/users")
public class UserController {

    @Autowired
    private UserService userService;

    // GET all
    @GetMapping
    public List<User> getAllUsers() {
        return userService.findAll();
    }

    // GET by ID
    @GetMapping("/{id}")
    public ResponseEntity<User> getUserById(@PathVariable Long id) {
        User user = userService.findById(id);
        return ResponseEntity.ok(user);
    }

    // POST – create
    @PostMapping
    public ResponseEntity<User> createUser(@RequestBody @Valid User user) {
        User created = userService.save(user);
        return ResponseEntity.status(HttpStatus.CREATED).body(created);
    }

    // PUT – full update
    @PutMapping("/{id}")
    public ResponseEntity<User> updateUser(@PathVariable Long id,
                                           @RequestBody @Valid User user) {
        User updated = userService.update(id, user);
        return ResponseEntity.ok(updated);
    }

    // PATCH – partial update
    @PatchMapping("/{id}")
    public ResponseEntity<User> partialUpdate(@PathVariable Long id,
                                              @RequestBody Map<String, Object> fields) {
        User updated = userService.partialUpdate(id, fields);
        return ResponseEntity.ok(updated);
    }

    // DELETE
    @DeleteMapping("/{id}")
    public ResponseEntity<Void> deleteUser(@PathVariable Long id) {
        userService.delete(id);
        return ResponseEntity.noContent().build();
    }
}`}]
    },
    {
      q: "What is @PathVariable vs @RequestParam vs @RequestBody?",
      variants: [
        {l:"@PathVariable – from URL path", c:
`// URL: GET /api/users/42
@GetMapping("/api/users/{id}")
public User getUser(@PathVariable Long id) {
    return userService.findById(id);
}

// Multiple path variables
// URL: GET /api/users/42/orders/7
@GetMapping("/api/users/{userId}/orders/{orderId}")
public Order getOrder(@PathVariable Long userId,
                      @PathVariable Long orderId) {
    return orderService.find(userId, orderId);
}`},
        {l:"@RequestParam – from query string", c:
`// URL: GET /api/users?page=0&size=10&name=John
@GetMapping("/api/users")
public Page<User> getUsers(
        @RequestParam(defaultValue = "0") int page,
        @RequestParam(defaultValue = "10") int size,
        @RequestParam(required = false) String name) {
    return userService.findAll(page, size, name);
}`},
        {l:"@RequestBody – from request body (JSON)", c:
`@PostMapping("/api/users")
public ResponseEntity<User> createUser(@RequestBody @Valid User user) {
    // Spring automatically deserializes JSON body to User object
    User saved = userService.save(user);
    return ResponseEntity.status(HttpStatus.CREATED).body(saved);
}`}
      ]
    },
    {
      q: "How do you use ResponseEntity to return proper HTTP responses?",
      variants: [{l:"ResponseEntity examples", c:
`// 200 OK with body
return ResponseEntity.ok(user);

// 201 Created with body
return ResponseEntity.status(HttpStatus.CREATED).body(user);

// 204 No Content (e.g. delete)
return ResponseEntity.noContent().build();

// 404 Not Found
return ResponseEntity.notFound().build();

// 400 Bad Request with message
return ResponseEntity.badRequest().body("Invalid input");

// Custom headers
return ResponseEntity.ok()
        .header("X-Custom-Header", "value")
        .body(user);

// Dynamic status
HttpStatus status = found ? HttpStatus.OK : HttpStatus.NOT_FOUND;
return ResponseEntity.status(status).body(result);`}]
    },
    {
      q: "How do you handle exceptions globally using @ControllerAdvice?",
      note: "@ControllerAdvice + @ExceptionHandler gives a centralised place for all error handling.",
      variants: [{l:"Global exception handler", c:
`@ControllerAdvice
public class GlobalExceptionHandler {

    @ExceptionHandler(ResourceNotFoundException.class)
    public ResponseEntity<ErrorResponse> handleNotFound(
            ResourceNotFoundException ex, HttpServletRequest request) {
        ErrorResponse error = new ErrorResponse(
            HttpStatus.NOT_FOUND.value(),
            ex.getMessage(),
            request.getRequestURI()
        );
        return ResponseEntity.status(HttpStatus.NOT_FOUND).body(error);
    }

    @ExceptionHandler(MethodArgumentNotValidException.class)
    public ResponseEntity<Map<String, String>> handleValidation(
            MethodArgumentNotValidException ex) {
        Map<String, String> errors = new HashMap<>();
        ex.getBindingResult().getFieldErrors()
          .forEach(err -> errors.put(err.getField(), err.getDefaultMessage()));
        return ResponseEntity.badRequest().body(errors);
    }

    @ExceptionHandler(Exception.class)
    public ResponseEntity<ErrorResponse> handleGeneral(Exception ex) {
        ErrorResponse error = new ErrorResponse(500, "Internal Server Error", "");
        return ResponseEntity.status(HttpStatus.INTERNAL_SERVER_ERROR).body(error);
    }
}`}]
    },
    {
      q: "How do you validate request body fields using Bean Validation?",
      note: "Add spring-boot-starter-validation dependency. Use @Valid or @Validated to trigger validation.",
      variants: [{l:"Bean validation on request body", c:
`// 1. DTO with validation annotations
public class UserRequest {
    @NotBlank(message = "Name is required")
    private String name;

    @Email(message = "Invalid email format")
    @NotBlank
    private String email;

    @Min(value = 18, message = "Age must be at least 18")
    @Max(value = 100)
    private int age;

    @NotNull
    @Size(min = 6, message = "Password must be at least 6 characters")
    private String password;

    @Pattern(regexp = "\\d{10}", message = "Phone must be 10 digits")
    private String phone;
    // getters/setters
}

// 2. Controller – trigger with @Valid
@PostMapping("/api/users")
public ResponseEntity<User> createUser(@RequestBody @Valid UserRequest request) {
    return ResponseEntity.status(HttpStatus.CREATED).body(userService.create(request));
}`}]
    },
    {
      q: "How do you implement pagination and sorting in a REST API?",
      variants: [{l:"Pagination with Pageable", c:
`// Controller
@GetMapping("/api/users")
public ResponseEntity<Page<User>> getUsers(
        @RequestParam(defaultValue = "0") int page,
        @RequestParam(defaultValue = "10") int size,
        @RequestParam(defaultValue = "id") String sortBy,
        @RequestParam(defaultValue = "asc") String direction) {

    Sort sort = direction.equalsIgnoreCase("desc")
            ? Sort.by(sortBy).descending()
            : Sort.by(sortBy).ascending();

    Pageable pageable = PageRequest.of(page, size, sort);
    Page<User> users = userService.findAll(pageable);
    return ResponseEntity.ok(users);
}

// Service
public Page<User> findAll(Pageable pageable) {
    return userRepository.findAll(pageable);
}

// URL example: GET /api/users?page=0&size=5&sortBy=name&direction=desc`}]
    }
  ]
},
{
  title: "Spring Data JPA",
  qs: [
    {
      q: "How do you create a JPA entity?",
      variants: [{l:"Full JPA entity example", c:
`@Entity
@Table(name = "users")
public class User {

    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    @Column(name = "first_name", nullable = false, length = 50)
    private String firstName;

    @Column(unique = true, nullable = false)
    private String email;

    @Column(name = "created_at")
    @CreationTimestamp
    private LocalDateTime createdAt;

    @UpdateTimestamp
    private LocalDateTime updatedAt;

    @Enumerated(EnumType.STRING)
    private UserStatus status;

    @Transient  // not persisted to DB
    private String fullDisplayName;

    // getters, setters, constructors
}`}]
    },
    {
      q: "How do you create a JPA Repository and use built-in methods?",
      variants: [
        {l:"JpaRepository with built-in methods", c:
`public interface UserRepository extends JpaRepository<User, Long> {
    // JpaRepository provides out of the box:
    // save(entity), findById(id), findAll(), deleteById(id),
    // count(), existsById(id), findAll(Pageable), saveAll(list)
}

// Usage in service
@Service
public class UserService {
    @Autowired
    private UserRepository userRepository;

    public User save(User user)       { return userRepository.save(user); }
    public Optional<User> findById(Long id) { return userRepository.findById(id); }
    public List<User> findAll()       { return userRepository.findAll(); }
    public void delete(Long id)       { userRepository.deleteById(id); }
    public long count()               { return userRepository.count(); }
    public boolean exists(Long id)    { return userRepository.existsById(id); }
}`},
        {l:"Derived query methods (method name = query)", c:
`public interface UserRepository extends JpaRepository<User, Long> {

    // SELECT * FROM users WHERE email = ?
    Optional<User> findByEmail(String email);

    // SELECT * FROM users WHERE first_name = ? AND status = ?
    List<User> findByFirstNameAndStatus(String firstName, UserStatus status);

    // SELECT * FROM users WHERE salary > ?

`@Component
public class JwtUtil {
    @Value("\${jwt.secret}")
    private String secret;

    @Value("\${jwt.expiration}")
    private long expiration; // in ms

    public String generateToken(String username) {
        return Jwts.builder()
            .setSubject(username)
            .setIssuedAt(new Date())
            .setExpiration(new Date(System.currentTimeMillis() + expiration))
            .signWith(SignatureAlgorithm.HS256, secret)
            .compact();
    }

    public String extractUsername(String token) {
        return Jwts.parser().setSigningKey(secret)
            .parseClaimsJws(token).getBody().getSubject();
    }

    public boolean validateToken(String token, UserDetails userDetails) {
        String username = extractUsername(token);
        return username.equals(userDetails.getUsername()) && !isTokenExpired(token);
    }

    private boolean isTokenExpired(String token) {
        Date exp = Jwts.parser().setSigningKey(secret)
            .parseClaimsJws(token).getBody().getExpiration();
        return exp.before(new Date());
    }
}`},
        {l:"JWT filter", c:
`@Component
public class JwtAuthFilter extends OncePerRequestFilter {

    @Autowired private JwtUtil jwtUtil;
    @Autowired private UserDetailsService userDetailsService;

    @Override
    protected void doFilterInternal(HttpServletRequest request,
                                    HttpServletResponse response,
                                    FilterChain filterChain)
            throws ServletException, IOException {

        String authHeader = request.getHeader("Authorization");
        String token = null, username = null;

        if (authHeader != null && authHeader.startsWith("Bearer ")) {
            token = authHeader.substring(7);
            username = jwtUtil.extractUsername(token);
        }

        if (username != null && SecurityContextHolder.getContext().getAuthentication() == null) {
            UserDetails userDetails = userDetailsService.loadUserByUsername(username);
            if (jwtUtil.validateToken(token, userDetails)) {
                UsernamePasswordAuthenticationToken authToken =
                    new UsernamePasswordAuthenticationToken(
                        userDetails, null, userDetails.getAuthorities());
                authToken.setDetails(new WebAuthenticationDetailsSource().buildDetails(request));
                SecurityContextHolder.getContext().setAuthentication(authToken);
            }
        }
        filterChain.doFilter(request, response);
    }
}`}

@Transactional(readOnly = true) // default read-only for all methods
public class UserService {

    private final UserRepository userRepository;
    private final PasswordEncoder passwordEncoder;

    // Constructor injection (no @Autowired needed)
    public UserService(UserRepository userRepository,
                       PasswordEncoder passwordEncoder) {
        this.userRepository = userRepository;
        this.passwordEncoder = passwordEncoder;
    }

    public List<User> findAll() {
        return userRepository.findAll();
    }

    public User findById(Long id) {
        return userRepository.findById(id)
            .orElseThrow(() -> new ResourceNotFoundException("User not found: " + id));
    }

    @Transactional  // override read-only for write operations
    public User create(UserRequest request) {
        if (userRepository.existsByEmail(request.getEmail())) {
            throw new DuplicateResourceException("Email already exists");
        }
        User user = new User();
        user.setName(request.getName());
        user.setEmail(request.getEmail());
        user.setPassword(passwordEncoder.encode(request.getPassword()));
        return userRepository.save(user);
    }

    @Transactional
    public User update(Long id, UserRequest request) {
        User user = findById(id);
        user.setName(request.getName());
        return userRepository.save(user);
    }

    @Transactional
    public void delete(Long id) {
        User user = findById(id);
        userRepository.delete(user);
    }
}`}]

`// 1. Enable caching
@SpringBootApplication
@EnableCaching
public class MyApplication { ... }

// 2. Use on service methods
@Service
public class UserService {

    // Cache result – if same id called again, DB is skipped
    @Cacheable(value = "users", key = "#id")
    public User findById(Long id) {
        return userRepository.findById(id).orElseThrow(...);
    }

    // Update cache when data changes
    @CachePut(value = "users", key = "#user.id")
    public User update(User user) {
        return userRepository.save(user);
    }

    // Remove from cache on delete
    @CacheEvict(value = "users", key = "#id")
    public void delete(Long id) {
        userRepository.deleteById(id);
    }

    // Clear entire cache
    @CacheEvict(value = "users", allEntries = true)
    public void clearAllCache() { }
}`},

// ── HELPERS ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── CUSTOM Q's (localStorage) ──────────────────────────────────────────────────
var CUSTOM_KEY = 'springboot_cheat_custom_qs';
function loadCustom() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]'); } catch(e){ return []; } }
function saveCustom(a) { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(a)); } catch(e){} }

function getSections() {
  var c = loadCustom();
  if (c.length === 0) return SECTIONS;
  return [{ title: '\u2B50 My Custom Questions', qs: c, isCustom: true }].concat(SECTIONS);
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
function render(filter) {
  var root = document.getElementById('root');
  var noR  = document.getElementById('noResults');
  filter = (filter||'').toLowerCase().trim();
  var html = '', total = 0;
  var all = getSections();

  for (var si = 0; si < all.length; si++) {
    var sec = all[si], isC = !!sec.isCustom, items = [];
    for (var qi = 0; qi < sec.qs.length; qi++) {
      var q = sec.qs[qi];
      if (!filter) { items.push({q:q,idx:qi}); continue; }
      var hit = q.q.toLowerCase().indexOf(filter)>=0 || ((q.note||'').toLowerCase().indexOf(filter)>=0);
      if (!hit) for (var vi=0;vi<q.variants.length;vi++) {
        if (q.variants[vi].l.toLowerCase().indexOf(filter)>=0 || q.variants[vi].c.toLowerCase().indexOf(filter)>=0){ hit=true; break; }
      }
      if (hit) items.push({q:q,idx:qi});
    }
    if (!items.length) continue;
    total += items.length;
    html += '<div class="section-wrap"><div class="section-title">'+esc(sec.title)+'</div>';
    for (var ii=0;ii<items.length;ii++) {
      var item=items[ii].q;
      var noteHtml = item.note ? '<div class="note">&#128204; '+esc(item.note)+'</div>' : '';
      var vHtml = '';
      for (var vv=0;vv<item.variants.length;vv++) {
        var v=item.variants[vv];
        vHtml += '<div class="variant"><div class="vlabel">'+esc(v.l)+'</div><pre>'+esc(v.c)+'</pre></div>';
      }
      html += '<div class="q-card'+(isC?' custom-card':'')+'">'+
              '<div class="q-trigger"><div class="q-text">'+esc(item.q)+'</div><div class="chevron">&#9660;</div></div>'+
              '<div class="q-body">'+noteHtml+vHtml+'</div></div>';
    }
    html += '</div>';
  }
  root.innerHTML = html;
  noR.style.display = total===0 ? 'block' : 'none';
}

// ── ACCORDION ──────────────────────────────────────────────────────────────────
document.getElementById('root').addEventListener('click', function(e) {
  var el = e.target;
  while (el && el !== this) {
    if (el.classList.contains('q-trigger')) {
      var card = el.closest ? el.closest('.q-card') : el.parentElement;
      if (card) card.classList.toggle('open');
      return;
    }
    el = el.parentElement;
  }
});

document.getElementById('searchBox').addEventListener('input', function(){ render(this.value); });

// ── MODAL ──────────────────────────────────────────────────────────────────────
var variantCount = 1;

function openModal() {
  variantCount = 1;
  document.getElementById('qTitle').value = '';
  document.getElementById('qNote').value = '';
  document.getElementById('variantsWrap').innerHTML = makeVariantBlock(0);
  document.getElementById('addModal').style.display = 'flex';
  document.getElementById('qTitle').focus();
}
function closeModal() { document.getElementById('addModal').style.display = 'none'; }

function makeVariantBlock(idx) {
  return '<div class="variant-block" id="vb'+idx+'">'+
    '<div class="vb-header"><span class="vb-label">Answer / Variant '+(idx+1)+'</span>'+
    (idx>0 ? '<button type="button" class="rm-variant" onclick="removeVariant('+idx+')">&#10005; Remove</button>' : '')+
    '</div>'+
    '<input type="text" class="modal-input" id="vLabel'+idx+'" placeholder="Label (e.g. Using @Scheduled)" />'+
    '<textarea class="modal-code" id="vCode'+idx+'" rows="7" placeholder="Paste your code here..."></textarea>'+
    '</div>';
}
function addVariant() {
  document.getElementById('variantsWrap').insertAdjacentHTML('beforeend', makeVariantBlock(variantCount));
  variantCount++;
}
function removeVariant(idx) { var e=document.getElementById('vb'+idx); if(e) e.remove(); }

function saveQuestion() {
  var title = document.getElementById('qTitle').value.trim();
  var note  = document.getElementById('qNote').value.trim();
  if (!title) { alert('Please enter a question title.'); return; }
  var variants = [];
  for (var i=0;i<variantCount;i++) {
    var lEl=document.getElementById('vLabel'+i), cEl=document.getElementById('vCode'+i);
    if (!lEl||!cEl) continue;
    var l=lEl.value.trim(), c=cEl.value.trim();
    if (!l&&!c) continue;
    variants.push({l: l||'Solution', c: c});
  }
  if (!variants.length) { alert('Please add at least one answer/variant.'); return; }
  var newQ = {q:title, variants:variants};
  if (note) newQ.note = note;
  var c = loadCustom(); c.push(newQ); saveCustom(c);
  closeModal();
  render(document.getElementById('searchBox').value);
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('addModal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

render('');
</script>
