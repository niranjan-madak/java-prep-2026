      q: "What is Microservices Architecture and how is it different from Monolith?",
      note: "Microservices = independently deployable, loosely coupled services each owning their own data.",
      variants: [{l:"Monolith vs Microservices comparison", c:
`/* MONOLITH
   - Single deployable unit
   - All modules tightly coupled in one codebase
   - Shared database
   - Scale the entire app even if only one part is under load
   - Easier to develop initially, harder to scale and maintain
*/

/* MICROSERVICES
   - Each feature is a separate independently deployable service
   - Services communicate via REST, gRPC, or Message Queues
   - Each service owns its own database (Database per Service pattern)
   - Scale only the services that need it
   - Technology agnostic – each service can use a different stack
*/

/* Typical Microservices breakdown of an e-commerce app:
   user-service      → manages users, auth
   product-service   → manages product catalog
   order-service     → manages orders
   payment-service   → handles payments
   notification-service → sends emails/SMS
   api-gateway       → single entry point for clients
*/`}]

  COMPONENT                  PURPOSE                         SPRING TOOL

*/`}]

`@Component
public class AuthenticationFilter implements GatewayFilter {

    @Autowired private JwtUtil jwtUtil;
    @Autowired private RouteValidator routeValidator;

    @Override
    public Mono<Void> filter(ServerWebExchange exchange, GatewayFilterChain chain) {
        ServerHttpRequest request = exchange.getRequest();

        // Skip auth for public endpoints
        if (routeValidator.isOpenEndpoint.test(request)) {
            return chain.filter(exchange);
        }

        // Check Authorization header
        if (!request.getHeaders().containsKey(HttpHeaders.AUTHORIZATION)) {
            throw new RuntimeException("Missing authorization header");
        }

        String authHeader = request.getHeaders().getFirst(HttpHeaders.AUTHORIZATION);
        String token = authHeader != null ? authHeader.substring(7) : null;

        try {
            jwtUtil.validateToken(token);
        } catch (Exception e) {
            throw new RuntimeException("Invalid or expired token");
        }

        return chain.filter(exchange);
    }
}

// RouteValidator – defines which endpoints are public
@Component
public class RouteValidator {
    public static final List<String> openEndpoints = List.of(
        "/api/auth/register",
        "/api/auth/login",
        "/eureka"
    );
    public Predicate<ServerHttpRequest> isOpenEndpoint =
        req -> openEndpoints.stream()
            .noneMatch(uri -> req.getURI().getPath().contains(uri));
}`}

@Configuration
public class FeignConfig {

    @Bean
    public RequestInterceptor requestInterceptor() {
        return template -> {
            // Forward JWT token to downstream services
            ServletRequestAttributes attrs =
                (ServletRequestAttributes) RequestContextHolder.getRequestAttributes();
            if (attrs != null) {
                String token = attrs.getRequest().getHeader("Authorization");
                if (token != null) template.header("Authorization", token);
            }
        };

    @Bean
    public ErrorDecoder errorDecoder() {
        return (methodKey, response) -> {
            if (response.status() == 404)
                return new ResourceNotFoundException("Resource not found via Feign");
            return new Exception("Feign error: " + response.status());
        };
    }
}

<dependency>
    <groupId>org.springframework.boot</groupId>
    <artifactId>spring-boot-starter-webflux</artifactId>

@Configuration
public class WebClientConfig {
    @Bean
    @LoadBalanced

    }

@Service
public class OrderService {
    @Autowired
    private WebClient.Builder webClientBuilder;

    // Non-blocking GET
    public Mono<UserResponse> getUserById(Long id) {
        return webClientBuilder.build()
            .get()
            .uri("http://USER-SERVICE/api/users/" + id)
            .retrieve()
            .bodyToMono(UserResponse.class);
    }

    // Non-blocking POST
    public Mono<UserResponse> createUser(UserRequest request) {
        return webClientBuilder.build()
            .post()
            .uri("http://USER-SERVICE/api/users")
            .bodyValue(request)
            .retrieve()
            .onStatus(HttpStatusCode::isError,
                response -> Mono.error(new RuntimeException("User service error")))
            .bodyToMono(UserResponse.class);
    }
}`}]

    {
      q: "What is a Circuit Breaker and why is it needed?",
      note: "Without a circuit breaker, a slow/failing service can cascade failures across the entire system.",
      variants: [{l:"Circuit Breaker concept + states", c:
`/*
  PROBLEM: Order-Service calls Payment-Service.
  If Payment-Service is slow or down, Order-Service
  threads pile up waiting → entire system crashes.

  CIRCUIT BREAKER STATES:
  ┌──────────┐    failures >= threshold    ┌──────────┐
  │  CLOSED  │ ─────────────────────────► │   OPEN   │
  │(normal)  │                            │(blocking)│
  └──────────┘                            └──────────┘
       ▲                                       │
       │    success                            │ after wait duration
       │                                       ▼

`@Service
public class OrderService {

    @Autowired
    private UserServiceClient userServiceClient;

    // Circuit Breaker – if user-service fails, use fallback
    @CircuitBreaker(name = "USER-SERVICE", fallbackMethod = "getUserFallback")
    public UserResponse getUserById(Long id) {
        return userServiceClient.getUserById(id);
    }

    // Fallback – must have same return type and params + Throwable
    public UserResponse getUserFallback(Long id, Throwable ex) {
        System.out.println("Fallback triggered: " + ex.getMessage());
        return new UserResponse(id, "Unknown User", "N/A"); // default response
    }

    // Retry + CircuitBreaker combined
    @Retry(name = "USER-SERVICE")
    @CircuitBreaker(name = "USER-SERVICE", fallbackMethod = "getUserFallback")
    public UserResponse getUserWithRetry(Long id) {
        return userServiceClient.getUserById(id);
    }

    // RateLimiter – limit calls per time period
    @RateLimiter(name = "USER-SERVICE", fallbackMethod = "rateLimitFallback")
    public UserResponse getUserRateLimited(Long id) {
        return userServiceClient.getUserById(id);
    }
    public UserResponse rateLimitFallback(Long id, Throwable t) {
        throw new RuntimeException("Rate limit exceeded. Try again later.");
    }
}`},

`/*
  KAFKA KEY CONCEPTS:
  ─────────────────────────────────────────────────────
  Producer   → service that publishes events/messages
  Consumer   → service that subscribes and processes events
  Topic      → named channel where events are published
  Partition  → topics are split into partitions (parallelism)
  Broker     → Kafka server that stores and serves messages
  Consumer Group → group of consumers sharing the same topic load

  MICROSERVICES USE CASES:
  ─────────────────────────────────────────────────────
  Order placed → notify payment-service + inventory-service
  Payment done → notify order-service + notification-service
  User created → notify email-service + analytics-service
  Stock updated → notify pricing-service

  KAFKA vs REST (Feign/RestTemplate):
  REST   → synchronous, tight coupling, both services must be up
  Kafka  → asynchronous, loose coupling, consumer can be down temporarily
*/`}]

@Configuration
public class FeignClientInterceptor implements RequestInterceptor {

    private static final String AUTHORIZATION_HEADER = "Authorization";
    private static final String BEARER_TOKEN_TYPE = "Bearer";

    @Override
    public void apply(RequestTemplate template) {
        // Get token from current request context
        ServletRequestAttributes attrs =
            (ServletRequestAttributes) RequestContextHolder.getRequestAttributes();

        if (attrs != null) {
            HttpServletRequest request = attrs.getRequest();
            String authHeader = request.getHeader(AUTHORIZATION_HEADER);

            if (StringUtils.hasText(authHeader) && authHeader.startsWith(BEARER_TOKEN_TYPE)) {
                template.header(AUTHORIZATION_HEADER, authHeader);
            }
        }
    }
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── CUSTOM Q's (localStorage) ──────────────────────────────────────────────────
var CUSTOM_KEY = 'microservices_cheat_custom_qs';
function loadCustom() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]'); } catch(e){ return []; } }
function saveCustom(a) { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(a)); } catch(e){} }

function getSections() {
  var c = loadCustom();
  if (c.length === 0) return SECTIONS;
  return [{ title: '\u2B50 My Custom Questions', qs: c, isCustom: true }].concat(SECTIONS);
}

// ── RENDER ─────────────────────────────────────────────────────────────────────
function render(filter) {
  var root = document.getElementById('root');
  var noR  = document.getElementById('noResults');
  filter = (filter||'').toLowerCase().trim();
  var html = '', total = 0;
  var all = getSections();

  for (var si = 0; si < all.length; si++) {
    var sec = all[si], isC = !!sec.isCustom, items = [];
    for (var qi = 0; qi < sec.qs.length; qi++) {
      var q = sec.qs[qi];
      if (!filter) { items.push({q:q,idx:qi}); continue; }
      var hit = q.q.toLowerCase().indexOf(filter)>=0 || ((q.note||'').toLowerCase().indexOf(filter)>=0);
      if (!hit) for (var vi=0;vi<q.variants.length;vi++) {
        if (q.variants[vi].l.toLowerCase().indexOf(filter)>=0 || q.variants[vi].c.toLowerCase().indexOf(filter)>=0){ hit=true; break; }
      }
      if (hit) items.push({q:q,idx:qi});
    }
    if (!items.length) continue;
    total += items.length;
    html += '<div class="section-wrap"><div class="section-title">'+esc(sec.title)+'</div>';
    for (var ii=0;ii<items.length;ii++) {
      var item=items[ii].q;
      var noteHtml = item.note ? '<div class="note">&#128204; '+esc(item.note)+'</div>' : '';
      var vHtml = '';
      for (var vv=0;vv<item.variants.length;vv++) {
        var v=item.variants[vv];
        vHtml += '<div class="variant"><div class="vlabel">'+esc(v.l)+'</div><pre>'+esc(v.c)+'</pre></div>';
      }
      html += '<div class="q-card'+(isC?' custom-card':'')+'">'+
              '<div class="q-trigger"><div class="q-text">'+esc(item.q)+'</div><div class="chevron">&#9660;</div></div>'+
              '<div class="q-body">'+noteHtml+vHtml+'</div></div>';
    }
    html += '</div>';
  }
  root.innerHTML = html;
  noR.style.display = total===0 ? 'block' : 'none';
}

// ── ACCORDION ──────────────────────────────────────────────────────────────────
document.getElementById('root').addEventListener('click', function(e) {
  var el = e.target;
  while (el && el !== this) {
    if (el.classList.contains('q-trigger')) {
      var card = el.closest ? el.closest('.q-card') : el.parentElement;
      if (card) card.classList.toggle('open');
      return;
    }
    el = el.parentElement;
  }
});

document.getElementById('searchBox').addEventListener('input', function(){ render(this.value); });

// ── MODAL ──────────────────────────────────────────────────────────────────────
var variantCount = 1;

function openModal() {
  variantCount = 1;
  document.getElementById('qTitle').value = '';
  document.getElementById('qNote').value = '';
  document.getElementById('variantsWrap').innerHTML = makeVariantBlock(0);
  document.getElementById('addModal').style.display = 'flex';
  document.getElementById('qTitle').focus();
}
function closeModal() { document.getElementById('addModal').style.display = 'none'; }

function makeVariantBlock(idx) {
  return '<div class="variant-block" id="vb'+idx+'">'+
    '<div class="vb-header"><span class="vb-label">Answer / Variant '+(idx+1)+'</span>'+
    (idx>0 ? '<button type="button" class="rm-variant" onclick="removeVariant('+idx+')">&#10005; Remove</button>' : '')+
    '</div>'+
    '<input type="text" class="modal-input" id="vLabel'+idx+'" placeholder="Label (e.g. Kafka Producer setup)" />'+
    '<textarea class="modal-code" id="vCode'+idx+'" rows="7" placeholder="Paste your code here..."></textarea>'+
    '</div>';
}
function addVariant() {
  document.getElementById('variantsWrap').insertAdjacentHTML('beforeend', makeVariantBlock(variantCount));
  variantCount++;
}
function removeVariant(idx) { var e=document.getElementById('vb'+idx); if(e) e.remove(); }

function saveQuestion() {
  var title = document.getElementById('qTitle').value.trim();
  var note  = document.getElementById('qNote').value.trim();
  if (!title) { alert('Please enter a question title.'); return; }
  var variants = [];
  for (var i=0;i<variantCount;i++) {
    var lEl=document.getElementById('vLabel'+i), cEl=document.getElementById('vCode'+i);
    if (!lEl||!cEl) continue;
    var l=lEl.value.trim(), c=cEl.value.trim();
    if (!l&&!c) continue;
    variants.push({l: l||'Solution', c: c});
  }
  if (!variants.length) { alert('Please add at least one answer/variant.'); return; }
  var newQ = {q:title, variants:variants};
  if (note) newQ.note = note;
  var c = loadCustom(); c.push(newQ); saveCustom(c);
  closeModal();
  render(document.getElementById('searchBox').value);
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('addModal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

render('');
</script>
